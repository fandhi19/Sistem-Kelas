<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classroom Point Tracker, Group & Spin Wheel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="shortcut icon" href="images/Logo Patbhe.png" type="image/x-icon" />

    <style>
      :root {
        --bg-dark: #0b0f19;
        --card-bg: rgba(22, 31, 49, 0.7);
        --gold: #f59e0b;
        --silver: #94a3b8;
        --bronze: #d97706;
      }

      body {
        background-color: var(--bg-dark);
        background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b0f19 75%);
        color: #f8fafc;
        font-family: "Plus Jakarta Sans", sans-serif;
        min-height: 100vh;
      }

      .dashboard-header {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
      }

      /* Podium Section */
      .podium-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-bottom: 25px;
      }

      .podium-card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 15px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.3s ease;
      }

      .podium-card.rank-1 {
        border-color: rgba(245, 158, 11, 0.5);
        background: linear-gradient(180deg, rgba(245, 158, 11, 0.15) 0%, rgba(30, 41, 59, 0.7) 100%);
        transform: scale(1.03);
      }
      .podium-card.rank-2 {
        border-color: rgba(148, 163, 184, 0.4);
      }
      .podium-card.rank-3 {
        border-color: rgba(217, 119, 6, 0.4);
      }

      .badge-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 10px;
        font-weight: 800;
      }
      .badge-1 {
        background: var(--gold);
        color: #000;
        box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
      }
      .badge-2 {
        background: var(--silver);
        color: #000;
      }
      .badge-3 {
        background: var(--bronze);
        color: #fff;
      }

      /* Form & Select Dark Mode */
      .search-box {
        background: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        color: #fff !important;
        border-radius: 12px !important;
      }
      .search-box::placeholder {
        color: #64748b;
      }

      select.search-box {
        background-color: #1e293b !important;
        color: #ffffff !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        cursor: pointer;
      }
      select.search-box option {
        background-color: #0f172a !important;
        color: #ffffff !important;
        padding: 10px;
      }

      /* Styling Tabel Murid */
      .custom-table-card {
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        overflow: hidden;
      }

      .table-dark-custom {
        --bs-table-bg: transparent;
        --bs-table-color: #f8fafc;
        margin-bottom: 0;
      }

      .table-dark-custom th {
        background: rgba(30, 41, 59, 0.8);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        color: #94a3b8;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.8rem;
        letter-spacing: 0.05em;
        padding: 16px;
      }

      .table-dark-custom td {
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        padding: 12px 16px;
        vertical-align: middle;
      }

      .table-dark-custom tbody tr:hover {
        background: rgba(255, 255, 255, 0.03);
      }

      .student-avatar {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, #3b82f6, #06b6d4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        color: #fff;
        font-size: 0.85rem;
      }

      .point-badge {
        font-size: 1.1rem;
        font-weight: 800;
        padding: 4px 12px;
        border-radius: 8px;
        display: inline-block;
        min-width: 60px;
      }

      .point-positive {
        background: rgba(16, 185, 129, 0.15);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }

      .point-negative {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }

      .point-zero {
        background: rgba(148, 163, 184, 0.15);
        color: #94a3b8;
        border: 1px solid rgba(148, 163, 184, 0.3);
      }

      .btn-action {
        border: none;
        border-radius: 8px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
      }

      .btn-minus {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        width: 34px;
        height: 34px;
      }
      .btn-minus:hover {
        background: #ef4444;
        color: #fff;
      }

      .btn-plus-1 {
        background: rgba(59, 130, 246, 0.15);
        color: #60a5fa;
        width: 34px;
        height: 34px;
      }
      .btn-plus-1:hover {
        background: #3b82f6;
        color: #fff;
      }

      /* Modal Styling */
      .modal-content {
        background: #0f172a;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        border-radius: 24px;
      }

      .group-card {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
      }

      /* Wheel Container & Canvas Styling */
      .wheel-wrapper {
        position: relative;
        width: 340px;
        height: 340px;
        margin: 0 auto;
      }
      .wheel-pointer {
        position: absolute;
        top: -12px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 15px solid transparent;
        border-right: 15px solid transparent;
        border-top: 25px solid #ef4444;
        z-index: 10;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
      }

      @media (max-width: 768px) {
        .podium-container {
          grid-template-columns: 1fr;
        }
        .podium-card.rank-1 {
          transform: scale(1);
        }
        .wheel-wrapper {
          width: 280px;
          height: 280px;
        }
      }
    </style>
  </head>
  <body class="p-3 p-md-4">
    <div class="container-fluid max-width-xl">
      <!-- Header Controls -->
      <div class="dashboard-header p-3 p-md-4 mb-4 d-flex flex-wrap align-items-center justify-content-between gap-3 shadow-lg">
        <div class="d-flex align-items-center gap-3">
          <div class="p-3 bg-primary bg-opacity-10 text-primary rounded-4 border border-primary border-opacity-25">
            <i class="bi bi-trophy-fill fs-3 text-warning"></i>
          </div>
          <div>
            <h4 class="fw-bold mb-0 text-white">Live Leaderboard Kelas</h4>
            <span class="text-secondary small" id="syncStatus"><i class="bi bi-cloud-check text-success me-1"></i> Terhubung ke Google Sheets</span>
          </div>
        </div>

        <div class="d-flex align-items-center gap-2 flex-grow-1 flex-md-grow-0" style="min-width: 220px">
          <input type="text" id="searchInput" class="form-control search-box px-3 py-2" placeholder="🔍 Cari nama..." onkeyup="filterStudents()" />
        </div>

        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-outline-light rounded-3 py-2 px-3 fw-bold" onclick="fetchStudentsFromSheet()"><i class="bi bi-arrow-clockwise me-1"></i> Refresh Data</button>
          <a href="absensi.html" class="btn btn-success rounded-3 py-2 px-3 fw-bold"> <i class="bi bi-calendar-check me-1"></i> Absensi </a>
          <button class="btn btn-warning rounded-3 py-2 px-3 fw-bold text-dark" data-bs-toggle="modal" data-bs-target="#wheelModal" onclick="initWheel()"><i class="bi bi-disc me-1"></i> Spin Wheel</button>
          <button class="btn btn-primary rounded-3 py-2 px-3 fw-bold" data-bs-toggle="modal" data-bs-target="#groupModal"><i class="bi bi-shuffle me-1"></i> Kelompok</button>
          <button class="btn btn-outline-danger btn-sm rounded-3 border-opacity-25 py-2 px-3" onclick="resetPoints()"><i class="bi bi-arrow-counterclockwise me-1"></i> Reset</button>
        </div>
      </div>

      <!-- Top 3 Podium Section -->
      <div class="podium-container" id="podiumSection"></div>

      <!-- Tabel Seluruh Murid -->
      <h6 class="text-secondary fw-bold text-uppercase mb-3 tracking-wider"><i class="bi bi-people-fill me-2"></i>Daftar Seluruh Murid</h6>

      <div class="custom-table-card shadow-lg mb-4">
        <div class="table-responsive">
          <table class="table table-dark-custom align-middle">
            <thead>
              <tr>
                <th style="width: 80px" class="text-center">No</th>
                <th>Nama Murid</th>
                <th style="width: 150px" class="text-center">Poin</th>
                <th style="width: 140px" class="text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="studentTableBody">
              <tr>
                <td colspan="4" class="text-info text-center py-5"><span class="spinner-border spinner-border-sm me-2"></span>Memuat data dari Google Sheets...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Modal Acak Kelompok -->
    <div class="modal fade" id="groupModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content p-3 p-md-4">
          <div class="modal-header border-0 pb-0">
            <h4 class="modal-title fw-bold text-white"><i class="bi bi-people-fill text-primary me-2"></i>Acak Kelompok Belajar</h4>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row align-items-center g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label text-secondary small fw-bold">Jumlah Kelompok:</label>
                <select id="groupCountSelect" class="form-select search-box">
                  <option value="2">2 Kelompok</option>
                  <option value="3">3 Kelompok</option>
                  <option value="4" selected>4 Kelompok</option>
                  <option value="6">6 Kelompok</option>
                  <option value="9">9 Kelompok</option>
                </select>
              </div>
              <div class="col-md-6 d-flex align-items-end">
                <button class="btn btn-success w-100 fw-bold py-2 rounded-3" onclick="generateGroups()"><i class="bi bi-arrow-repeat me-1"></i> Acak Sekarang!</button>
              </div>
            </div>

            <div class="row g-3" id="groupsResultContainer">
              <div class="text-center text-secondary py-5">Klik tombol <strong>"Acak Sekarang!"</strong> untuk membagi siswa secara otomatis.</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Spin Wheel -->
    <div class="modal fade" id="wheelModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-3 p-md-4 text-center">
          <div class="modal-header border-0 pb-0">
            <h4 class="modal-title fw-bold text-white"><i class="bi bi-disc text-warning me-2"></i>Roda Acak Siswa</h4>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="wheel-wrapper my-3">
              <div class="wheel-pointer"></div>
              <canvas id="wheelCanvas" width="340" height="340"></canvas>
            </div>

            <!-- Hasil Terpilih -->
            <div id="winnerDisplay" class="p-3 my-2 bg-primary bg-opacity-10 border border-primary border-opacity-25 rounded-4 d-none">
              <span class="text-secondary small fw-semibold">Siswa Terpilih:</span>
              <h3 class="fw-bold text-warning mb-0" id="winnerName">-</h3>
            </div>

            <button id="spinBtn" class="btn btn-warning btn-lg w-100 fw-bold rounded-3 py-2 mt-2 text-dark shadow" onclick="spinWheel()"><i class="bi bi-play-circle-fill me-1"></i> PUTAR RODA!</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // GANTI URL INI DENGAN URL APPS SCRIPT DATABASE POIN KAMU
      const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEefUHGFqVo2oMYoqdiN1bNoIQg4Pb17YhPW86DNEDr38mf2J2Nyj45mOGyCFQuCJ3/exec";

      /* ================= SYSTEM SFX (Web Audio API) ================= */
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      function playSound(type) {
        if (audioCtx.state === "suspended") audioCtx.resume();

        if (type === "plus") {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === "minus") {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === "tick") {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = "triangle";
          osc.frequency.setValueAtTime(400, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.03);
        } else if (type === "fanfare") {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const oscF = audioCtx.createOscillator();
            const gainF = audioCtx.createGain();
            oscF.connect(gainF);
            gainF.connect(audioCtx.destination);

            oscF.type = "triangle";
            oscF.frequency.value = freq;
            const startTime = audioCtx.currentTime + idx * 0.08;
            gainF.gain.setValueAtTime(0.2, startTime);
            gainF.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
            oscF.start(startTime);
            oscF.stop(startTime + 0.4);
          });
        }
      }

      /* ================= SYSTEM DATA SISWA ================= */
      const sampleNames = [
        "Ainun Risky",
        "Alexander Modegliano Biwada",
        "Arindia Maharani",
        "Aufa Tazkia Rahmadani",
        "Cornelia Dwi Arini Puspaningrum",
        "Dzaki Hammam Ibrahim",
        "Elena Putri Nareswari",
        "Fatima Ahzahra",
        "Freya Gracia",
        "Gabriel Alvaro Anindito",
        "Gabriella Braveadonia Valga",
        "Hubertus Radhitya Melvin",
        "Isabel Ada Lamont",
        "Julio Kevin Nugroho",
        "Justien Pratama Setiawan",
        "Kesya Hanifah Ufairah",
        "Kristoforus Arsenio Reswara",
        "Kumala Devi Andini Setiawan",
        "Leonardus Evan Syandana Rama",
        "Lintang Nareswara",
        "Maria Felicia Nindya Danastri",
        "Maria Kimiko Ruby Renggawan",
        "Maria Lethicia Viona",
        "Muhammad Suttan Fahrezy",
        "Nadia Az-Zahra",
        "Narayan itendralay Isyunanto",
        "Ozzie Mahardika Prabaswara",
        "Penta Kusuma",
        "Queen Callysta Eleana",
        "Queen Gabriella Ginoga",
        "Rafi Ardan Saputra",
        "Raihanah Lembayung Indah",
        "Rayhan Evan Sachio",
        "Tiara Febriana",
        "Tsabita Neysa Azalia",
        "Yunita Putri Prasetiya",
      ];

      const initialStudents = sampleNames.map((name, index) => ({
        id: index + 1,
        name: name,
        points: 0,
      }));

      let students = [...initialStudents];

      async function fetchStudentsFromSheet() {
        const syncStatus = document.getElementById("syncStatus");
        syncStatus.innerHTML = `<i class="bi bi-arrow-repeat text-warning spinner-border spinner-border-sm me-1"></i> Menyinkronkan...`;

        try {
          const res = await fetch(GOOGLE_SCRIPT_URL);
          const data = await res.json();
          if (data && data.length > 0) {
            students = data;
          } else {
            // Jika sheet masih kosong, kirim data awal ke sheet
            await syncAllToSheet(initialStudents);
            students = [...initialStudents];
          }
          syncStatus.innerHTML = `<i class="bi bi-cloud-check text-success me-1"></i> Terhubung ke Google Sheets`;
        } catch (err) {
          console.error("Gagal mengambil data dari Google Sheets:", err);
          syncStatus.innerHTML = `<i class="bi bi-exclamation-triangle text-danger me-1"></i> Gagal Sinkronisasi`;
        } finally {
          renderPodium();
          renderTable(getFilteredData());
        }
      }

      async function updatePointOnSheet(student) {
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: student.id, name: student.name, points: student.points }),
          });
        } catch (err) {
          console.error("Gagal mengirim update poin ke Google Sheets:", err);
        }
      }

      async function syncAllToSheet(dataArray) {
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dataArray),
          });
        } catch (err) {
          console.error("Gagal menyinkronkan seluruh data ke Google Sheets:", err);
        }
      }

      function getInitials(name) {
        const parts = name.split(" ");
        return parts.length > 1 ? (parts[0][0] + parts[1][0]).toUpperCase() : parts[0].substring(0, 2).toUpperCase();
      }

      function renderPodium() {
        const podiumEl = document.getElementById("podiumSection");
        const sorted = [...students].sort((a, b) => b.points - a.points);

        const top1 = sorted[0];
        const top2 = sorted[1];
        const top3 = sorted[2];

        podiumEl.innerHTML = `
        <div class="podium-card rank-2">
          <div class="badge-icon badge-2"><i class="bi bi-award-fill"></i></div>
          <span class="badge bg-secondary mb-2">PODIUM 2</span>
          <h5 class="fw-bold text-white mb-1 text-truncate">${top2 ? top2.name : "-"}</h5>
          <div class="fs-3 fw-extrabold text-info">${top2 ? top2.points : 0} <span class="fs-6 text-secondary">Pts</span></div>
        </div>

        <div class="podium-card rank-1">
          <div class="badge-icon badge-1"><i class="bi bi-trophy-fill"></i></div>
          <span class="badge bg-warning text-dark mb-2 fw-bold">👑 PODIUM 1</span>
          <h4 class="fw-bold text-white mb-1 text-truncate">${top1 ? top1.name : "-"}</h4>
          <div class="fs-2 fw-extrabold text-warning">${top1 ? top1.points : 0} <span class="fs-6 text-secondary">Pts</span></div>
        </div>

        <div class="podium-card rank-3">
          <div class="badge-icon badge-3"><i class="bi bi-award-fill"></i></div>
          <span class="badge bg-dark mb-2">PODIUM 3</span>
          <h5 class="fw-bold text-white mb-1 text-truncate">${top3 ? top3.name : "-"}</h5>
          <div class="fs-3 fw-extrabold text-warning-emphasis">${top3 ? top3.points : 0} <span class="fs-6 text-secondary">Pts</span></div>
        </div>
      `;
      }

      function renderTable(data = students) {
        const tbody = document.getElementById("studentTableBody");
        tbody.innerHTML = "";

        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="text-center text-secondary py-4">Data tidak ditemukan.</td></tr>`;
          return;
        }

        data.forEach((student) => {
          let pointClass = "point-zero";
          if (student.points > 0) pointClass = "point-positive";
          else if (student.points < 0) pointClass = "point-negative";

          tbody.innerHTML += `
          <tr>
            <td class="text-center text-secondary fw-semibold">#${String(student.id).padStart(2, "0")}</td>
            <td>
              <div class="d-flex align-items-center gap-3">
                <div class="student-avatar">${getInitials(student.name)}</div>
                <div class="fw-bold text-white">${student.name}</div>
              </div>
            </td>
            <td class="text-center">
              <span class="point-badge ${pointClass}">${student.points}</span>
            </td>
            <td class="text-center">
              <div class="d-flex justify-content-center gap-2">
                <button class="btn-action btn-minus" onclick="updatePoint(${student.id}, -1)" title="Kurang 1 Poin">-1</button>
                <button class="btn-action btn-plus-1" onclick="updatePoint(${student.id}, 1)" title="Tambah 1 Poin">+1</button>
              </div>
            </td>
          </tr>
        `;
        });
      }

      function updatePoint(id, change) {
        const student = students.find((s) => s.id === id);
        if (student) {
          // Memungkinkan poin bernilai negatif tanpa Math.max(0, ...)
          student.points += change;

          playSound(change < 0 ? "minus" : "plus");
          renderPodium();
          renderTable(getFilteredData());

          // Kirim perubahan poin secara background ke Google Sheets
          updatePointOnSheet(student);
        }
      }

      function generateGroups() {
        const numGroups = parseInt(document.getElementById("groupCountSelect").value);
        const shuffled = [...students].sort(() => Math.random() - 0.5);
        const groups = Array.from({ length: numGroups }, () => []);

        shuffled.forEach((student, index) => {
          groups[index % numGroups].push(student);
        });

        const container = document.getElementById("groupsResultContainer");
        container.innerHTML = "";

        groups.forEach((group, idx) => {
          let membersHTML = group.map((s) => `<li class="py-1 border-bottom border-secondary border-opacity-25 small">${s.name}</li>`).join("");
          container.innerHTML += `
          <div class="col-md-6 col-lg-4">
            <div class="group-card p-3 h-100">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="fw-bold text-primary mb-0"><i class="bi bi-people me-1"></i> Kelompok ${idx + 1}</h6>
                <span class="badge bg-primary bg-opacity-25 text-primary small">${group.length} Siswa</span>
              </div>
              <ul class="list-unstyled mb-0">
                ${membersHTML}
              </ul>
            </div>
          </div>
        `;
        });

        playSound("fanfare");
      }

      /* ================= SYSTEM SPIN WHEEL ================= */
      let startAngle = 0;
      let arc = 0;
      let spinTimeout = null;
      let isSpinning = false;

      const colors = ["#ef4444", "#f97316", "#f59e0b", "#10b981", "#06b6d4", "#3b82f6", "#8b5cf6", "#ec4899"];

      function initWheel() {
        const canvas = document.getElementById("wheelCanvas");
        if (!canvas) return;
        arc = Math.PI / (students.length / 2);

        document.getElementById("winnerDisplay").classList.add("d-none");
        drawWheel();
      }

      function drawWheel() {
        const canvas = document.getElementById("wheelCanvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const outsideRadius = 160;
        const textRadius = 138;
        const insideRadius = 35;

        ctx.clearRect(0, 0, 340, 340);

        students.forEach((student, i) => {
          const angle = startAngle + i * arc;
          ctx.fillStyle = colors[i % colors.length];

          ctx.beginPath();
          ctx.arc(170, 170, outsideRadius, angle, angle + arc, false);
          ctx.arc(170, 170, insideRadius, angle + arc, angle, true);
          ctx.fill();

          ctx.save();
          ctx.fillStyle = "white";
          ctx.translate(170 + Math.cos(angle + arc / 2) * textRadius, 170 + Math.sin(angle + arc / 2) * textRadius);
          ctx.rotate(angle + arc / 2);

          let firstName = student.name.split(" ")[0];
          if (firstName.length > 6) {
            firstName = firstName.substring(0, 5) + ".";
          }

          ctx.font = 'bold 9px "Plus Jakarta Sans", sans-serif';
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";
          ctx.fillText(firstName, 0, 0);
          ctx.restore();
        });
      }

      function spinWheel() {
        if (isSpinning) return;
        isSpinning = true;

        document.getElementById("winnerDisplay").classList.add("d-none");
        document.getElementById("spinBtn").disabled = true;

        const spinAngleStart = Math.random() * 10 + 10;
        let spinTime = 0;
        const spinTimeTotal = Math.random() * 3000 + 4000;

        function rotate() {
          spinTime += 30;
          if (spinTime >= spinTimeTotal) {
            stopRotateWheel();
            return;
          }

          const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
          startAngle += (spinAngle * Math.PI) / 180;
          drawWheel();

          if (Math.floor(spinTime / 100) % 2 === 0) playSound("tick");

          spinTimeout = setTimeout(rotate, 30);
        }
        rotate();
      }

      function stopRotateWheel() {
        clearTimeout(spinTimeout);
        const degrees = (startAngle * 180) / Math.PI + 90;
        const arclen = (arc * 180) / Math.PI;
        const index = Math.floor((360 - (degrees % 360)) / arclen);

        const winner = students[(index + students.length) % students.length];

        document.getElementById("winnerName").innerText = winner.name;
        document.getElementById("winnerDisplay").classList.remove("d-none");

        playSound("fanfare");

        isSpinning = false;
        document.getElementById("spinBtn").disabled = false;
      }

      function easeOut(t, b, c, d) {
        const ts = (t /= d) * t;
        const tc = ts * t;
        return b + c * (tc + -3 * ts + 3 * t);
      }

      function getFilteredData() {
        const query = document.getElementById("searchInput").value.toLowerCase();
        return students.filter((s) => s.name.toLowerCase().includes(query));
      }

      function filterStudents() {
        renderTable(getFilteredData());
      }

      async function resetPoints() {
        if (confirm("Reset semua poin ke 0?")) {
          students.forEach((s) => (s.points = 0));
          renderPodium();
          renderTable();
          await syncAllToSheet(students);
        }
      }

      // Ambil data pertama kali saat halaman dimuat
      fetchStudentsFromSheet();
    </script>
  </body>
</html>
